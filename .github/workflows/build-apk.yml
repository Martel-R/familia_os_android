name: Build Android APK & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Android Signing Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-permanent-v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (Signed)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare APK File
        run: |
          cp app/build/outputs/apk/release/app-release.apk familia-os.apk
          ls -lh familia-os.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: familia-os-apk
          path: familia-os.apk

      - name: Publish APK to GitHub Release (latest-apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk familia-os.apk \
            --title "Familia OS Android (Última Versão)" \
            --notes "Build automático gerado a partir do commit ${GITHUB_SHA::7}." \
            --latest

  smoke-test-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: familia-os-apk

      - name: Create Smoke Test Script
        run: |
          cat << 'EOF' > /tmp/smoke-test.sh
          set -x
          adb install -r familia-os.apk

          echo "=== 1. TESTING LOGIN SCREEN ==="
          adb logcat -c
          adb shell am start -W -n br.com.raevan.familialm/.MainActivity
          sleep 6
          PID_LOGIN=$(adb shell pidof br.com.raevan.familialm || true)
          echo "PID (Login): $PID_LOGIN"
          adb logcat -d AndroidRuntime:E FamiliaApp:E FamiliaAppCrash:E *:S
          if [ -z "$PID_LOGIN" ]; then
            echo "ERROR: APK crashed on Login screen!"
            exit 1
          fi

          echo "=== 2. TESTING BIOMETRIC UNLOCK -> DASHBOARD ==="
          adb shell am force-stop br.com.raevan.familialm
          adb logcat -c
          adb shell am start -W -n br.com.raevan.familialm/.MainActivity --es rota_inicial desbloqueio_biometrico
          sleep 8
          PID_BIO=$(adb shell pidof br.com.raevan.familialm || true)
          echo "PID (Biometric -> Painel): $PID_BIO"
          adb logcat -d AndroidRuntime:E FamiliaApp:E FamiliaAppCrash:E *:S
          if [ -z "$PID_BIO" ]; then
            echo "ERROR: APK crashed on Biometric/Dashboard transition!"
            exit 1
          fi

          echo "=== 3. TESTING PAINEL PRINCIPAL & SUPABASE REPOSITORIES ==="
          adb shell am force-stop br.com.raevan.familialm
          adb logcat -c
          adb shell am start -W -n br.com.raevan.familialm/.MainActivity --es rota_inicial painel
          sleep 8
          PID_PAINEL=$(adb shell pidof br.com.raevan.familialm || true)
          echo "PID (Painel): $PID_PAINEL"
          adb logcat -d AndroidRuntime:E FamiliaApp:E FamiliaAppCrash:E *:S
          if [ -z "$PID_PAINEL" ]; then
            echo "ERROR: APK crashed on Painel Principal!"
            exit 1
          fi
          EOF
          chmod +x /tmp/smoke-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK Smoke Test on Android 14 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: bash /tmp/smoke-test.sh
